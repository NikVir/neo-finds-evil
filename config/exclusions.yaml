  # Basename PREFIXES suppressed — generic software-deployment noise families
  # (OS hotfixes, runtimes, AV installers) that land on multiple hosts together.
  denylist_prefixes:
    - windows-kb        # Windows hotfix installers
    - ndp40-kb          # .NET 4.0 hotfix installers
    - vcredist          # VC++ redistributables
    - sae               # McAfee SaaS/SAE installer bundle
    - setup             # generic installers (setup.exe already denylisted)
    - mc                # McAfee installer/util family (mcconsol, mcscancheck, ...)
    - mfe               # McAfee driver/util family

  # Legitimate admin/recon utilities — surfaced but confidence capped at MEDIUM
  # (dual-use: used by both admins and attackers).
  dual_use:
    - at.exe
    - net.exe
    - net1.exe
    - wmic.exe
    - reg.exe
    - sc.exe
    - schtasks.exe
    - tasklist.exe
    - ipconfig.exe
    - whoami.exe
    - nltest.exe
    - quser.exe
    - netstat.exe
    - systeminfo.exe
    - vssadmin.exe
    - cscript.exe
    - wscript.exe
    - ping.exe

  # Known offensive tooling — cross-host reuse is HIGH-signal (marker only;
  # confidence still respects evidence type).
  offensive:
    - psexec.exe
    - psexesvc.exe
    - mimikatz.exe
    - wce.exe
    - gsecdump.exe
    - pwdump.exe
    - fgdump.exe
    - procdump.exe
    - sdelete.exe
    - nc.exe
    - ncat.exe
    - netcat.exe
    - winexe.exe

credential_tooling:
  # Credential-theft tool name PATTERNS (substring match against EXECUTED
  # basenames). Matches are NAME-HEURISTIC / inferential: identity is inferred
  # from naming families, NOT confirmed by hashing or binary analysis. The
  # *katz* family pattern catches Mimikatz variants/wrappers (e.g. hydrakatz)
  # without requiring the literal name 'mimikatz'.
  patterns:
    - mimikatz
    - katz          # Mimikatz family / variants (hydrakatz, ...)
    - mimilib
    - sekurlsa
    - lsadump
    - gsecdump
    - pwdump
    - fgdump
    - wce            # Windows Credential Editor
    - lazagne
    - samdump
    - creddump
    - cachedump
    - hashdump
    - procdump       # often used to dump lsass
    - dumpert
    - nanodump
    - safetykatz
