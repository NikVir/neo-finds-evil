# Exclusion / category dictionaries for behavioral hunts.
# Basenames are matched case-insensitively (the loader lowercases them).
# Maintainable here — never hardcode these in Cypher.

lateral_tool_reuse:
  # Suppressed entirely from cross-host reuse: expected on many hosts (OS /
  # platform / AV / VM) or are INCIDENT-RESPONDER tooling. Flagging responder
  # tools as attacker spread would be a false positive (see FINDINGS.md §11).
