# Application dependencies. Memory tooling: .cursor/pyproject.toml
[project]
name = "sans-dev"
version = "0.1.0"
description = "Neo4j forensics graph ingest and GraphQL API"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "mcp>=1.2",
    "neo4j>=5.26",
    "pyyaml>=6.0",
]

[project.scripts]
forensics-ingest = "forensics.cli:main"
forensics-mcp = "forensics.mcp_server:main"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics"]
